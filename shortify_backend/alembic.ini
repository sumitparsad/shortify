# Alembic configuration file.
# This file is read by `alembic` when running migration commands.
# The [alembic] section is required.

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for new migration file names
# Convention: timestamp_description.py
# Example: 20260101_120000_create_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for timestamp in file names
timezone = UTC

# Max length of the slug (description) portion of the file name
truncate_slug_length = 40

# SQLAlchemy connection URL is set dynamically in env.py
# DO NOT set sqlalchemy.url here — it reads from environment variables
# sqlalchemy.url = ...

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
